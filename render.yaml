services:
  - type: web
    name: inventoryManagementSystem
    runtime: docker
    branch: main
    buildCommand: "./mvnw clean install -DskipTests"
    startCommand: "java -jar target/inventoryManagementSystem-0.0.1-SNAPSHOT.jar"
    plan: free
    envVars:
      - key: JAVA_HOME
        value: /usr/lib/jvm/java-17-openjdk
